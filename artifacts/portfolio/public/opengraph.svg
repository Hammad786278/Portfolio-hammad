<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0d0d0f"/>

  <!-- Subtle grid -->
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#dccab0" stroke-width="0.3" opacity="0.12"/>
    </pattern>
    <radialGradient id="glow" cx="30%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#dccab0" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0d0d0f" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Corner brackets — top left -->
  <path d="M 60 120 L 60 60 L 120 60" stroke="#dccab0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.8"/>
  <!-- Corner brackets — bottom right -->
  <path d="M 1140 510 L 1140 570 L 1080 570" stroke="#dccab0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.8"/>
  <!-- Corner brackets — top right subtle -->
  <path d="M 1080 60 L 1140 60 L 1140 120" stroke="#dccab0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.25"/>
  <!-- Corner brackets — bottom left subtle -->
  <path d="M 120 570 L 60 570 L 60 510" stroke="#dccab0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.25"/>

  <!-- H monogram — large, left side -->
  <rect x="80" y="200" width="22" height="110" rx="4" fill="#dccab0" opacity="0.9"/>
  <rect x="80" y="249" width="60" height="14" rx="3" fill="#dccab0" opacity="0.9"/>
  <rect x="118" y="200" width="22" height="110" rx="4" fill="#dccab0" opacity="0.9"/>

  <!-- Divider line -->
  <line x1="80" y1="340" x2="1120" y2="340" stroke="#dccab0" stroke-width="0.5" opacity="0.15"/>

  <!-- Top label -->
  <text x="80" y="175" font-family="monospace" font-size="13" fill="#dccab0" opacity="0.5" letter-spacing="4">PORTFOLIO // 2025</text>

  <!-- Main name -->
  <text x="80" y="460" font-family="Georgia, serif" font-size="112" fill="#f5f0ea" font-style="italic" letter-spacing="-3" opacity="0.95">Hammad</text>
  <text x="420" y="560" font-family="Georgia, serif" font-size="112" fill="#dccab0" font-style="italic" letter-spacing="-3" opacity="0.85">Hussain</text>

  <!-- Right side — role tags -->
  <text x="820" y="200" font-family="monospace" font-size="13" fill="#dccab0" opacity="0.45" letter-spacing="3">01. AI / ML ENGINEER</text>
  <text x="820" y="230" font-family="monospace" font-size="13" fill="#dccab0" opacity="0.45" letter-spacing="3">02. FULL-STACK DEV</text>
  <text x="820" y="260" font-family="monospace" font-size="13" fill="#dccab0" opacity="0.45" letter-spacing="3">03. COMPUTER VISION</text>
  <text x="820" y="290" font-family="monospace" font-size="13" fill="#dccab0" opacity="0.45" letter-spacing="3">04. AUTOMATION</text>

  <!-- Bottom tagline -->
  <text x="80" y="600" font-family="monospace" font-size="14" fill="#dccab0" opacity="0.4" letter-spacing="3">BUILDING INTELLIGENT SYSTEMS END-TO-END</text>

  <!-- Accent dot -->
  <circle cx="1120" cy="60" r="6" fill="#dccab0" opacity="0.5"/>
  <circle cx="1120" cy="60" r="12" fill="none" stroke="#dccab0" stroke-width="1" opacity="0.2"/>
</svg>
