<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0d0d0f"/>

  <!-- Subtle grid -->
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#dccab0" stroke-width="0.3" opacity="0.1"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#dccab0" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#0d0d0f" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Corner brackets — top left (same as favicon, scaled up) -->
  <path d="M 60 140 L 60 60 L 140 60" stroke="#dccab0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.8"/>
  <!-- Corner brackets — bottom right -->
  <path d="M 1140 490 L 1140 570 L 1060 570" stroke="#dccab0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.8"/>
  <!-- Corner brackets — top right subtle -->
  <path d="M 1060 60 L 1140 60 L 1140 140" stroke="#dccab0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.25"/>
  <!-- Corner brackets — bottom left subtle -->
  <path d="M 140 570 L 60 570 L 60 490" stroke="#dccab0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.25"/>

  <!-- Big H monogram — centered, same proportions as favicon -->
  <!-- Left vertical bar -->
  <rect x="390" y="155" width="60" height="320" rx="10" fill="#dccab0"/>
  <!-- Right vertical bar -->
  <rect x="750" y="155" width="60" height="320" rx="10" fill="#dccab0"/>
  <!-- Crossbar -->
  <rect x="390" y="283" width="420" height="64" rx="10" fill="#dccab0"/>

  <!-- Accent dot — bottom right of H (same as favicon) -->
  <circle cx="820" cy="500" r="10" fill="#dccab0" opacity="0.5"/>

  <!-- Name below -->
  <text x="600" y="570" font-family="Georgia, 'Times New Roman', serif" font-size="28" fill="#dccab0" opacity="0.55" text-anchor="middle" letter-spacing="12" font-style="italic">HAMMAD HUSSAIN</text>
</svg>
